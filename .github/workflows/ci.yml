name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Tests and race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Node worker failure-path tests
        run: python3 -m unittest discover -s internal/node/testdata -p 'test_*.py'
      - name: Examples and command boundary
        run: |
          go build -trimpath -o bin/dashnet ./cmd/dashnet
          bin/dashnet validate --network examples/devnet.yaml
          bin/dashnet validate --network examples/testnet.yaml
          bin/dashnet validate --network examples/devnet-compute.yaml
          bin/dashnet validate --network examples/devnet-lifecycle.yaml
          for command in deployment-plan deploy doctor stop host-trust; do
            if bin/dashnet "$command"; then
              echo "$command accepted missing explicit intent"
              exit 1
            fi
          done
          if bin/dashnet provision; then
            echo 'Provisioning accepted missing explicit intent'
            exit 1
          fi
          if bin/dashnet bootstrap; then
            echo 'Bootstrap accepted missing plan and trusted host identity'
            exit 1
          fi
          if bin/dashnet apply; then
            echo 'An unimplemented mutation command unexpectedly succeeded'
            exit 1
          fi

  bootstrap-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Execute bootstrap recipe in disposable Ubuntu (mocked AWS and Docker)
        run: |
          docker build -t dashnet-recipe-test -f internal/bootstrap/testdata/Dockerfile .
          docker run --rm --network none dashnet-recipe-test

  core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve real Core image once and exercise wallet/registration recovery
        run: |
          set -euo pipefail
          docker pull dashpay/dashd:23
          image=$(docker image inspect dashpay/dashd:23 --format '{{index .RepoDigests 0}}')
          docker pull dashpay/drive:4.2.0-beta.3
          drive=$(docker image inspect dashpay/drive:4.2.0-beta.3 --format '{{index .RepoDigests 0}}')
          sudo env CORE_IMAGE="$image" DRIVE_IMAGE="$drive" DASHNET_DISPOSABLE_CI=1 python3 internal/node/testdata/core_integration.py

  platform-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native Tenderdash, Envoy TLS and DAPI gRPC contracts
        run: |
          set -euo pipefail
          images='[]'
          for spec in 'tenderdash=dashpay/tenderdash:1.8.0' 'gateway=dashpay/envoy:1.39.0-impr.1' 'dapi=dashpay/rs-dapi:4.2.0-beta.3' 'drive=dashpay/drive:4.2.0-beta.3'; do
            component=${spec%%=*}
            tag=${spec#*=}
            docker pull "$tag"
            pinned=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
            images=$(jq -c --arg component "$component" --arg pinned "$pinned" '. + [{component:$component,pinned:$pinned}]' <<< "$images")
          done
          sudo env PLATFORM_IMAGES="$images" DASHNET_DISPOSABLE_CI=1 python3 internal/node/testdata/platform_contract.py

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build standalone executable
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "out/dashnet-${GOOS}-${GOARCH}" ./cmd/dashnet
          cd out
          sha256sum "dashnet-${GOOS}-${GOARCH}" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashnet-${{ matrix.os }}-${{ matrix.arch }}
          path: out/
          retention-days: 14
          if-no-files-found: error

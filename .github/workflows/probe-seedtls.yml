name: probe seed TLS strict X.509
on:
  push:
    branches: ['probe/seedtls-strict-x509']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Runner image
        run: |
          cat /etc/os-release | head -4
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          python3 --version
          openssl version
      - name: What the test's listener sees when renew.peer disconnects
        run: python3 .github/probe/probe_server.py
      - name: Test with only the CA fixed (PR head 56d7501), swallowed exceptions printed
        if: always()
        run: python3 .github/probe/run_failing_test.py ca_fixed_only
      - name: Candidate test (num_tickets = 0), 25 runs of the whole seed TLS suite
        if: always()
        run: |
          failed=0
          for i in $(seq 1 25); do
            if ! python3 -m unittest discover -s internal/seedtls/testdata -p 'test_*.py' > out.txt 2>&1; then
              failed=$((failed+1)); echo "--- run $i failed"; cat out.txt
            fi
          done
          tail -4 out.txt
          echo "failed runs: $failed of 25"
          test "$failed" -eq 0
  previous-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          python3 --version
          openssl version
          python3 -c "import ssl; c = ssl.create_default_context(); print('default verify_flags', int(c.verify_flags), repr(c.verify_flags))"
      - name: What the test's listener sees on the previous image
        run: python3 .github/probe/probe_server.py
      - name: main's test file on the previous image
        if: always()
        run: python3 .github/probe/run_failing_test.py main_version
